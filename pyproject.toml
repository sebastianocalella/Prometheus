[project]
name = "prometheus-project-agent"
version = "0.1.0"
description = "A conversational assistant for shaping projects"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2", "streamlit>=1.40,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prometheus"]

[tool.pytest.ini_options]
pythonpath = ["."]
